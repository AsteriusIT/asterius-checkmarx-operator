apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: checkmarx-operator
resources:
  - ../../config
# Dummy credentials for the local API mock only.
secretGenerator:
  - name: checkmarx-auth
    literals:
      - CX_BASE_URI=http://checkmarx-api-mock.checkmarx-mock.svc.cluster.local:8080
      - CX_BASE_AUTH_URI=http://checkmarx-api-mock.checkmarx-mock.svc.cluster.local:8080
      - CX_TENANT=mock
      - CX_CLIENT_ID=mock-cli
      - CX_CLIENT_SECRET=mock-secret
generatorOptions:
  disableNameSuffixHash: true
