apiVersion: security.asteriusit.fr/v1alpha1
kind: CheckmarxClusterScan
metadata:
  name: cluster-images
spec:
  projectName: cluster-images
  credentialsSecretRef:
    namespace: checkmarx-operator
    name: checkmarx-auth
  # Optional: mount Docker registry credentials and enable local image resolution.
  # registryCredentialsSecretRef:
  #   namespace: checkmarx-operator
  #   name: nexus-registry-auth
  discovery:
    scanExisting: true
    scanNewImages: true
    excludeNamespaces:
      - checkmarx-operator
  maxConcurrentScans: 2
  # 0 disables periodic rescans; 86400 rescans daily while images remain present.
  rescanIntervalSeconds: 0
