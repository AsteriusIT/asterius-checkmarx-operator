name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15'
      - name: Unit tests
        shell: bash
        run: |
          mkdir -p reports
          python -m unittest discover -s tests -v 2>&1 | tee reports/unit-tests.txt
      - name: Verify vendored source checksums
        shell: bash
        run: python api-mock/scripts/upstream.py 2>&1 | tee reports/upstream.txt
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: error
          retention-days: 30
