apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: checkmarxclusterscans.security.asteriusit.fr
spec:
  group: security.asteriusit.fr
  scope: Cluster
  names:
    plural: checkmarxclusterscans
    singular: checkmarxclusterscan
    kind: CheckmarxClusterScan
    shortNames: [cxcluster]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Images
          type: integer
          jsonPath: .status.discoveredImages
        - name: Active
          type: integer
          jsonPath: .status.activeScans
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [projectName, credentialsSecretRef]
              properties:
                projectName:
                  type: string
                  minLength: 1
                  maxLength: 200
                credentialsSecretRef:
                  type: object
                  required: [namespace, name]
                  properties:
                    namespace:
                      type: string
                      minLength: 1
                      maxLength: 63
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
                discovery:
                  type: object
                  default: {}
                  properties:
                    scanExisting:
                      type: boolean
                      default: true
                    scanNewImages:
                      type: boolean
                      default: true
                    includeNamespaces:
                      type: array
                      maxItems: 1000
                      x-kubernetes-list-type: set
                      items:
                        type: string
                        maxLength: 63
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                    excludeNamespaces:
                      type: array
                      maxItems: 1000
                      x-kubernetes-list-type: set
                      items:
                        type: string
                        maxLength: 63
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                maxConcurrentScans:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 2
                rescanIntervalSeconds:
                  type: integer
                  minimum: 0
                  maximum: 31536000
                  default: 0
                timeoutSeconds:
                  type: integer
                  minimum: 60
                  maximum: 7200
                  default: 1800
                rerunToken:
                  type: string
                  maxLength: 200
                suspend:
                  type: boolean
                  default: false
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                discoveryInitialized:
                  type: boolean
                observedGeneration:
                  type: integer
                discoveredImages:
                  type: integer
                activeScans:
                  type: integer
                imageCounts:
                  type: object
                  additionalProperties:
                    type: integer
                lastDiscoveryTime:
                  type: string
                  format: date-time
