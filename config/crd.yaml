apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: checkmarxscans.security.example.io
spec:
  group: security.example.io
  scope: Namespaced
  names:
    plural: checkmarxscans
    singular: checkmarxscan
    kind: CheckmarxScan
    shortNames:
    - cxscan
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Job
      type: string
      jsonPath: .status.jobName
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - projectName
            - credentialsSecretRef
            - scanTypes
            properties:
              projectName: &id001
                type: string
                minLength: 1
              credentialsSecretRef:
                type: string
                pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
              scanTypes:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: string
                  enum:
                  - sast
                  - sca
                  - iac-security
              timeoutSeconds:
                type: integer
                minimum: 60
                maximum: 7200
                default: 1800
              rerunToken:
                type: string
              repository:
                type: object
                required:
                - url
                - branch
                properties:
                  url:
                    type: string
                    pattern: ^https://
                  branch: *id001
              workloadRef:
                type: object
                required:
                - kind
                - name
                properties:
                  kind:
                    type: string
                    enum:
                    - Deployment
                    - StatefulSet
                    - DaemonSet
                    - Job
                    - CronJob
                  name: *id001
            x-kubernetes-validations:
            - rule: has(self.repository) != has(self.workloadRef)
              message: Specify exactly one target
            - rule: '!has(self.workloadRef) || (size(self.scanTypes) == 1 && self.scanTypes[0]
                == ''iac-security'')'
              message: Workloads support IaC only
          status:
            type: object
            properties:
              phase:
                type: string
              jobName:
                type: string
              inputDigest:
                type: string
              observedGeneration:
                type: integer
              message:
                type: string
