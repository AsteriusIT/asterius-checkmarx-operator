apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: checkmarximagescans.security.example.io
spec:
  group: security.example.io
  scope: Namespaced
  names:
    plural: checkmarximagescans
    singular: checkmarximagescan
    kind: CheckmarxImageScan
    shortNames: [cximage]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: ClusterScan
          type: string
          jsonPath: .spec.clusterScan
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Present
          type: boolean
          jsonPath: .status.present
        - name: Image
          type: string
          jsonPath: .spec.image
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [clusterScan, imageKey, image, scanAllowed]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: Image records are immutable; configure the owning cluster scan instead
              properties:
                clusterScan:
                  type: string
                  maxLength: 253
                imageKey:
                  type: string
                  maxLength: 4096
                image:
                  type: string
                  maxLength: 2048
                  pattern: '^$|^[a-zA-Z0-9][a-zA-Z0-9._:/-]*@sha256:[a-f0-9]{64}$'
                scanAllowed:
                  type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
                present:
                  type: boolean
                referenceCount:
                  type: integer
                references:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [namespace, pod, container, image]
                    properties:
                      namespace:
                        type: string
                      pod:
                        type: string
                      container:
                        type: string
                      image:
                        type: string
                attempt:
                  type: integer
                runKey:
                  type: string
                jobName:
                  type: string
                finishedAt:
                  type: string
                  nullable: true
                  format: date-time
