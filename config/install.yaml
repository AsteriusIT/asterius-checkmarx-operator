apiVersion: v1
kind: Namespace
metadata:
  name: checkmarx-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkmarx-operator
  namespace: checkmarx-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: checkmarx-operator
  namespace: checkmarx-operator
rules:
- apiGroups:
  - security.asteriusit.fr
  resources:
  - checkmarxscans
  - checkmarxscans/status
  verbs:
  - get
  - list
  - watch
  - patch
  - update
- apiGroups:
  - security.asteriusit.fr
  resources:
  - checkmarximagescans
  - checkmarximagescans/status
  verbs:
  - get
  - list
  - create
  - patch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
  - create
- apiGroups:
  - batch
  resources:
  - cronjobs
  verbs:
  - get
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  - daemonsets
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: checkmarx-operator
  namespace: checkmarx-operator
subjects:
- kind: ServiceAccount
  name: checkmarx-operator
  namespace: checkmarx-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: checkmarx-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: checkmarx-operator-discovery
rules:
- apiGroups: ['']
  resources: [pods]
  verbs: [list]
- apiGroups: [security.asteriusit.fr]
  resources: [checkmarxclusterscans]
  verbs: [get, list, watch, patch]
- apiGroups: [security.asteriusit.fr]
  resources: [checkmarxclusterscans/status]
  verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: checkmarx-operator-discovery
subjects:
- kind: ServiceAccount
  name: checkmarx-operator
  namespace: checkmarx-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: checkmarx-operator-discovery
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkmarx-operator
  namespace: checkmarx-operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: checkmarx-operator
  template:
    metadata:
      labels:
        app: checkmarx-operator
    spec:
      serviceAccountName: checkmarx-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: operator
        image: checkmarx-operator:dev
        imagePullPolicy: IfNotPresent
        env:
        - name: CX_CLI_IMAGE
          value: docker.io/checkmarx/ast-cli:2.3.67@sha256:f9aece17f331c36cb6c5895d4c29c652f7a624c0f8256afefbc2420cf9d2be0e
        - name: PYTHONPATH
          value: /app
        - name: OPERATOR_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
